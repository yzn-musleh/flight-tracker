services:
  flight-tracker:
    build: .
    image: family-flight-tracker:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Named volume, not a bind mount: the SQLite file (WAL mode) and the
      # single-instance lock file both live here, surviving a container
      # recreate/image rebuild. DB_PATH/LOCK_PATH in the image already point
      # at /data (see Dockerfile) so no override is needed here.
      - flight-tracker-data:/data

volumes:
  flight-tracker-data:
