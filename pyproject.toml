[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-flight-tracker"
version = "0.1.0"
description = "Telegram bot that tracks flights and alerts on status changes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

# requirements.txt is kept as-is alongside this for Docker's build step to
# install from directly without needing pip's full pyproject/build-backend
# resolution in the image.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "time-machine==3.5.0",
    "types-requests==2.33.0.20260712",
]

[tool.setuptools]
py-modules = [
    "bot",
    "flight_api",
    "scheduler",
    "airports",
    "change_detection",
    "timezones",
    "access",
    "resilience",
    "singleton",
    "logging_config",
    "healthcheck",
]

[tool.setuptools.packages.find]
include = ["storage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# No explicit `[tool.ruff.lint] select`: this project has been linted
# against ruff's *default* rule set from Phase 0 onward (there was never a
# ruff config file before this one), so an explicit select list here would
# risk silently narrowing or widening what gets flagged. Only non-rule-
# selection settings (target-version) are pinned.

[tool.mypy]
python_version = "3.12"
strict = true
# Every production module passes `mypy --strict` with no per-file ignores
# and no blanket --ignore-missing-imports (types-requests, a dev dependency,
# covers the one third-party package that needed stubs). Test files aren't
# included in this invocation; only bot.py and the plain modules/packages it
# imports are checked.
